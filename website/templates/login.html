<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Digital Gate Polda Kalsel</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Inter', system-ui, sans-serif;
        }

        .bg-login {
            background-image: url("{{ url_for('static', filename='bg_polda.jpg') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
        }

        /* Overlay gelap agar form terlihat menonjol */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.6); 
            z-index: 1;
        }

        /* KARTU LOGIN SUPER COMPACT (DIET EKSTREM) */
        .login-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 320px; /* Dikecilkan drastis dari 420px menjadi 320px */
            padding: 30px 25px 20px; /* Ruang kosong (padding) dipangkas */
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 2;
            position: relative;
        }

        /* Input Field Ramping */
        .form-control, .input-group-text {
            padding: 8px 12px; /* Dibuat lebih pipih */
            font-size: 0.85rem;
            border: 1px solid #ced4da;
            background-color: #f8f9fa;
        }

        .form-control:focus {
            border-color: #c82333;
            box-shadow: none;
            background-color: #ffffff;
        }
        
        .input-group-text {
            background-color: #f1f3f5;
        }

        /* Tombol Merah Solid & Tipis */
        .btn-login {
            background-color: #c82333;
            border: none;
            padding: 9px;
            border-radius: 6px;
            font-weight: 700;
            letter-spacing: 0.5px;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .btn-login:hover {
            background-color: #a71d2a;
        }
    </style>
</head>
<body>

    <div class="bg-login">
        <div class="overlay"></div> 
        
        <div class="login-card">
            <!-- HEADER LOGO & JUDUL (LEBIH KECIL) -->
            <div class="text-center mb-3">
                <!-- Ikon Perisai Centang -->
                <i class="bi bi-shield-check text-secondary" style="font-size: 2.2rem; line-height: 1;"></i> 
                <h6 class="fw-bold mt-2 mb-0" style="color: #1e293b; letter-spacing: 0.5px; font-size: 1.1rem;">DIGITAL GATE</h6>
                <p class="text-muted mb-0" style="font-size: 0.65rem;">Mako Polda Kalimantan Selatan</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} fw-bold text-center py-2 mb-3" style="font-size: 0.75rem;" role="alert">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('login') }}" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <!-- FORM ID PERSONEL -->
                <div class="mb-2">
                    <label class="form-label fw-bold text-secondary mb-1" style="font-size: 0.7rem;">ID Personel</label>
                    <div class="input-group">
                        <span class="input-group-text text-muted border-end-0 px-2"><i class="bi bi-person-fill"></i></span>
                        <input type="text" name="username" class="form-control border-start-0" placeholder="Masukkan ID" required autofocus>
                    </div>
                </div>

                <!-- FORM KODE SANDI -->
                <div class="mb-3">
                    <label class="form-label fw-bold text-secondary mb-1" style="font-size: 0.7rem;">Kode Sandi</label>
                    <div class="input-group">
                        <span class="input-group-text text-muted border-end-0 px-2"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" name="password" class="form-control border-start-0" placeholder="Masukkan Sandi" required>
                    </div>
                </div>

                <!-- TOMBOL LOGIN -->
                <button type="submit" class="btn btn-login w-100 text-white shadow-sm">LOGIN SISTEM</button>
            </form>

            <!-- FOOTER BAWAH -->
            <div class="text-center mt-3 pt-2 border-top">
                <p class="text-muted mb-0" style="font-size: 0.65rem;">&copy; 2026 Bid TIK Polda Kalsel</p>
            </div>
        </div>
    </div>

</body>
</html>
